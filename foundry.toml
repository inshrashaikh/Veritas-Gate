[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"

remappings = [
    "forge-std/=lib/forge-std/src/",
    "contracts/=contracts/",
    "payloads/=contracts/payloads/"
]

# Formatting & Linting settings
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
